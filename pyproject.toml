[project]
name = "serving-plane"
version = "0.1.0"
requires-python = ">=3.12"
dependencies = [
  "fastapi>=0.115",
  "uvicorn[standard]>=0.32",
  "pydantic>=2.9",
  "pyyaml>=6.0",
  "httpx>=0.27",
  # Multi-tenant application/token/usage store (spec 2026-07-25). Async
  # SQLAlchemy with SQLite by default (dev/test, offline); prod points
  # DATABASE_URL at the shared Langfuse Postgres via the `postgres` extra.
  "sqlalchemy[asyncio]>=2.0",
  "aiosqlite>=0.20",
  # Password + token hashing for admin auth and API tokens.
  "argon2-cffi>=23.1",
  # Custom regex recognizers (per-app privacy rules): per-match timeout=
  # support for a ReDoS-safe matcher, which stdlib `re` lacks.
  "regex>=2024.0.0",
  # Egress gateway (steps 7-8): single multi-provider path (onprem/Azure/Bedrock).
  # Used as an SDK behind the policy gate, never as an ingress proxy.
  "litellm>=1.93,<2",
]

[dependency-groups]
# The OTel SDK is a TEST dependency, not just the `observability` extra it also
# appears in. Four whole modules -- test_capture_io, test_raw_completion_capture,
# test_trace_full_io, test_obs_export -- open with
# `pytest.importorskip("opentelemetry.sdk.trace")`, so without it they do not
# fail, they vanish: a clean checkout reports them as 4 skips and a green run.
# Those modules carry the CE-1 regression tests (the exporter must never author
# raw content under a `redacted` label) and every other assertion about what
# actually lands on a span. There is no CI in this repo, so a human running the
# suite is the only thing standing between a regression and a release -- and a
# silent skip defeats exactly that. Declared here so `uv sync` installs it.
dev = [
  "pytest>=8.3",
  "opentelemetry-sdk>=1.27",
  "opentelemetry-exporter-otlp-proto-http>=1.27",
]

# Presidio is the real demo detector but heavy (pulls spaCy). Tests use the
# regex detector, so keep it an opt-in extra: `uv sync --extra presidio`.
[project.optional-dependencies]
presidio = ["presidio-analyzer>=2.2", "presidio-anonymizer>=2.2"]

# OTel -> Langfuse telemetry export (Phase 4). Opt-in: `uv sync --extra observability`.
observability = [
  "opentelemetry-sdk>=1.27",
  "opentelemetry-exporter-otlp-proto-http>=1.27",
  "langfuse>=3.0",
  "prometheus-client>=0.20",
]
# Real Headroom ML compressor (Task 5b sibling of DeterministicCompressor). Opt-in,
# lazily imported by select_compressor(); the default path is offline and never
# requires this extra. Install with: `uv sync --extra compression`.
compression = ["headroom-ai>=0.1"]

# Postgres driver for reusing the in-cluster Langfuse Postgres as routeForge's
# application/usage store (spec 2026-07-25). Dev/test use SQLite (aiosqlite,
# core dep); deployment installs this: `uv sync --extra postgres`.
postgres = ["asyncpg>=0.30"]

# DSPy prompt-optimizer (Feature 3 Task 3). OFFLINE only -- never imported on
# the request-serving path (see tools/prompt_opt/). Opt-in: `uv sync --extra dspy`.
dspy = ["dspy-ai>=2.5"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"
# Narrowly silence a known third-party deprecation we don't own — do NOT
# blanket-ignore DeprecationWarning, that would hide our own future warnings.
filterwarnings = [
  # FastAPI's TestClient still imports starlette.testclient's deprecated httpx path.
  # Matched on message only: it fires once at import time and pytest reports the
  # importlib machinery as the "module", not starlette, so a module/category-path
  # restriction is unreliable here — the message text is already narrow and unique.
  "ignore:Using `httpx` with `starlette.testclient` is deprecated.*",
]

[tool.uv]
package = false
