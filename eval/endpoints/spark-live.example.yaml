# EXAMPLE --live endpoint file for the RouteForge DGX Spark (see the
# routeforge-dgx-spark-deploy memory note / .claude/skills/inference-backends).
# "<spark>" is a LITERAL PLACEHOLDER, never a real host or IP -- this file is
# NEVER run live by the test suite (a test may only assert it loads with
# live=True). To actually use it:
#
#   1. cp eval/endpoints/spark-live.example.yaml eval/endpoints/spark-live.yaml
#   2. replace every "<spark>" below with the Spark's real hostname/IP
#   3. export SP_ONPREM_API_KEY=...   (the onprem provider's key, not this file)
#   4. uv run python scripts/feasible_bench.py \
#        --suite eval/suites/starter.jsonl \
#        --endpoints eval/endpoints/spark-live.yaml --live
#
# Each model has its OWN OpenAI-compatible server on the Spark (corrected
# 2026-09-22 after the first live run; the earlier version put all three on
# :8000): qwen3.8-27b -> vLLM on :8000, nemotron-3.5-lightning -> a second
# vLLM on :8001, llama3.2:latest -> ollama on :11434 (no bearer key). All
# three are onboarded in the live registry as tier `cheap`, so they are
# `cheap` here too -- a benchmark should mirror the deployment it measures.
# Provider
# "onprem", price $0/1M, matching docs/guides/onboarding-models.md's own
# onboarding example (`"price_input": 0, "price_output": 0` for a freshly
# onboarded on-prem endpoint -- see that doc's (b2) and its onboarding
# JSON example). Contrast eval/endpoints/healthcare-sim.yaml, where
# local-llama is deliberately given a NON-zero price: that file is
# reproducing the illustrative §14 table's $0.08/request cost, not a real
# GPU-amortization quote -- two different scenarios (a priced illustrative
# example vs. a freshly-onboarded real endpoint), not a contradiction.
endpoints:
  - slug: qwen3.8-27b
    provider: onprem
    tier: cheap
    price: {input: 0, output: 0}
    region: us
    prompt_retention: none
    accepts_raw_sensitive: true
    live:
      endpoint: "http://<spark>:8000/v1"
      api_key_env: SP_ONPREM_API_KEY

  - slug: nemotron-3.5-lightning
    provider: onprem
    tier: cheap
    price: {input: 0, output: 0}
    region: us
    prompt_retention: none
    accepts_raw_sensitive: true
    live:
      endpoint: "http://<spark>:8001/v1"
      api_key_env: SP_ONPREM_API_KEY

  - slug: "llama3.2:latest"
    provider: onprem
    tier: cheap
    price: {input: 0, output: 0}
    region: us
    prompt_retention: none
    accepts_raw_sensitive: true
    live:
      endpoint: "http://<spark>:11434/v1"
