[project]
name = "routeforge-langchain-sample"
version = "0.1.0"
description = "A LangChain customer-support investigation agent for testing RouteForge"
requires-python = ">=3.12"
dependencies = [
  "httpx>=0.27,<1",
  "langchain-core>=1.0,<2",
]

[project.optional-dependencies]
dev = ["pytest>=8.3"]

[project.scripts]
routeforge-investigator = "routeforge_sample.cli:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["routeforge_sample"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"

