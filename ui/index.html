<!doctype html>
<html lang="en" class="dark">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <link
      rel="icon"
      href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 32 32'%3E%3Cg fill='none' stroke='%2338bdf8' stroke-width='2.4' stroke-linecap='round'%3E%3Cpath d='M6 16h7'/%3E%3Cpath d='M13 16c5 0 5-8 11-8'/%3E%3Cpath d='M13 16h11'/%3E%3Cpath d='M13 16c5 0 5 8 11 8'/%3E%3C/g%3E%3Ccircle cx='6' cy='16' r='2.6' fill='%2338bdf8'/%3E%3Ccircle cx='25' cy='8' r='3' fill='%2322c55e'/%3E%3Ccircle cx='25' cy='16' r='3' fill='%233b82f6'/%3E%3Ccircle cx='25' cy='24' r='3' fill='%23ef4444'/%3E%3C/svg%3E"
    />
    <title>routeForge — model router</title>
    <script>
      // Apply the saved theme before paint so there is no dark→light flash.
      (function () {
        try {
          var theme = localStorage.getItem("rf-theme") === "light" ? "light" : "dark";
          var el = document.documentElement;
          el.classList.remove("light", "dark");
          el.classList.add(theme);
          el.style.colorScheme = theme;
        } catch (e) {}
      })();
    </script>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
