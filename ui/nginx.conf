# The UI is served static; API + decision-stream calls are reverse-proxied to
# the `api` service so the browser sees one origin (matches the Vite dev proxy).
#
# We use Docker's embedded DNS (127.0.0.11) + a variable in proxy_pass so the
# `api` hostname is resolved PER REQUEST, not at startup. That means (a) nginx
# starts even if `api` is briefly absent, and (b) it re-resolves if `api`
# restarts with a new IP — avoiding the classic "host not found in upstream"
# boot failure and stale-IP proxying.
resolver 127.0.0.11 valid=10s ipv6=off;

server {
    listen 80;
    server_name _;
    root /usr/share/nginx/html;
    index index.html;

    # SPA: unknown routes fall back to index.html.
    location / {
        try_files $uri $uri/ /index.html;
    }

    # SSE decision stream — buffering off + long read timeout so events flush
    # immediately and the connection isn't idle-closed. (Longer prefix than
    # /api/, so nginx matches this first for the stream path.)
    location /api/stream {
        set $api_upstream http://api:8080;
        proxy_pass $api_upstream$request_uri;
        proxy_http_version 1.1;
        proxy_set_header Connection "";
        proxy_buffering off;
        proxy_cache off;
        proxy_read_timeout 3600s;
    }

    # REST API + OpenAI-compatible endpoint.
    location /api/ {
        set $api_upstream http://api:8080;
        proxy_pass $api_upstream$request_uri;
    }
    location /v1/ {
        set $api_upstream http://api:8080;
        proxy_pass $api_upstream$request_uri;
    }
}
