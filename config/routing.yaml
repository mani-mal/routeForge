# Scoring, thresholds, the model pool, and escalation. THIS FILE OWNS THEM.
# Hot-reloadable — editing thresholds live and re-running traffic is a strong demo
# moment. Keep the numbers legible. Budgets/residency/sensitivity are policy.yaml's;
# infra switches are serving.yaml's. Provider names must be spelled `onprem` here,
# identically to serving.yaml and pricing.yaml (the config lint enforces this).

# Canonical tier list. There are exactly three tiers everywhere: cheap | mid |
# frontier. There is no "strong" tier. Every tier named below must have >=1 member
# in model_pool, and every risk_floor must name a tier that exists (config lint).
tiers: [cheap, mid, frontier]

score_on: post_compression       # MUST be post_compression when Headroom is on
weights: {quality: 1.0, cost: 0.6, latency: 0.3, capacity: 0.2}

# Tier-default quality (the last rung of the quality ladder in app/routing/quality.py).
# Promoted from the router's old hardcoded _Q so it is single-sourced and lintable.
# There is NO per-model published `quality` on the model_pool below yet — the demo
# stays a tier-default regression. To add a published snapshot at onboarding, put e.g.
#   - {name: azure-gpt-mid, ..., quality: 0.70}   # AA Intelligence Index / 100, dated
# on a model_pool entry (see spec §9). Values must be in [0,1] (config lint).
tier_quality: {cheap: 0.5, mid: 0.75, frontier: 1.0}

complexity_thresholds:
  cheap_max: 0.35
  mid_max: 0.70
  # above mid_max -> frontier

# Confidence-driven escalation. ONE threshold, owned here. Below it, escalate one
# tier and re-run; capped by max_escalations. See routing-and-gateway skill for what
# "confidence" is (backend-reported).
confidence_escalation_threshold: 0.60
# Calibrates a REAL backend's mean-token-logprob into confidence:
# confidence = exp(mean_logprob / T). T=1 is raw geometric-mean token probability
# (~0.4-0.6 even for fluent answers → escalates almost everything, collapsing the
# "~70% to cheap" story — see routeforge-router-targets-mid). T=4 with the 0.60
# threshold means escalation fires only when mean per-token perplexity > ~7.7
# (genuinely uncertain output), so confident cheap-tier answers stay put. The mock
# backend ignores this (its confidence is seeded per persona).
confidence_logprob_temperature: 4.0
max_escalations: 1

# Risk floor = the minimum tier a request may use, applied AFTER the residency
# filter. Precedence: residency beats risk floor. An onprem_only high-risk request
# floors to the best ALLOWED (on-prem) tier and sets require_verification — it is
# never lifted to a cloud tier. See CLAUDE.md "Residency beats risk floor".
risk_floors:
  high: frontier                 # best cloud tier when cloud is permitted; else best on-prem
  medium: mid
  low: cheap

# `name` is the stable slug the router/pricing key on — do not rename it.
# `display_name` is what the UI shows customers (the real model). There are no
# built-in on-prem entries here any more: on-prem models are onboarded at
# runtime (ModelRegistry merges enabled onboarded rows into the effective pool
# at request time) — routeForge deploys nothing. An empty on-prem tier boots
# clean; on-prem candidates only appear once a customer onboards one.
model_pool:
  - {name: azure-gpt-mid,    provider: azure,   tier: mid,      display_name: "GPT-4o mini (Azure)",   litellm_model: "azure/gpt-4o-mini"}
  - {name: bedrock-frontier, provider: bedrock, tier: frontier, display_name: "Claude Sonnet (Bedrock)", litellm_model: "bedrock/anthropic.claude-3-5-sonnet-20241022-v2:0"}

fallback:
  max_retries_same_provider: 1
  backoff_base_ms: 100
