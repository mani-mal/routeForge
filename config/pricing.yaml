# USD per 1M tokens. Baseline for savings = most expensive frontier tier.
# Provider names spelled `onprem` identically to serving.yaml and routing.yaml
# (config lint enforces). Tiers must match the canonical list in routing.yaml.
#
# No built-in on-prem rows here: onboarded on-prem models carry their own
# price_input/price_output (set at onboarding time, see app/apps/store.py) —
# a GPU has an amortized cost, so those onboarding-time prices are never $0
# either, but they are per-model DB rows, not a config file concern.
models:
  azure-gpt-mid:    {input: 0.15, output: 0.60,  tier: mid,      provider: azure}
  # cached_input is what the all-frontier baseline charges for prompt tokens the serving engine reported as cached.
  bedrock-frontier: {input: 3.00, output: 15.00, cached_input: 0.30, tier: frontier, provider: bedrock}

baseline_model: bedrock-frontier
