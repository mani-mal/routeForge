# NeMo Agent Toolkit workflow config for the Serving Plane agent runtime.
#
# Mirrors the verified spike config (docs/superpowers/specs/2026-07-21-phase5-nat-integration-spike.md,
# section 1). `llms.sp_router.base_url`/`api_key` are placeholders — the runtime
# (app/agent/runtime.py, Task 4) overrides them per-run to point at the internal
# /internal/v1/{run_id}/chat/completions endpoint so each agent hop re-enters the
# router/gateway (steps 5-7). `max_iterations` is the step cap; the runtime enforces
# the real cap from policy.yaml's `agent_budgets.max_steps` at load time — this
# literal default is only used for standalone `nat validate`/`nat run`.
# NAT-native telemetry (full agent trajectory → Langfuse) is injected at runtime
# by app/agent/runtime.py, ONLY when LANGFUSE_HOST/PUBLIC_KEY/SECRET_KEY are set,
# using the full OTel endpoint. It is deliberately NOT a static block here: the
# `langfuse` exporter raises when keys are unset, which would break `nat validate`
# and every multi-step request in a keyless dev run. See runtime.py's
# `_maybe_enable_langfuse`.

functions:
  calculator:
    _type: calculator
    prefix: "Result:"
  doc_search:
    _type: doc_search
  crm_lookup:
    _type: crm_lookup

llms:
  sp_router:
    _type: openai
    model_name: auto
    base_url: "http://127.0.0.1:8080/internal/v1/placeholder/v1"
    api_key: "sk-internal"
    temperature: 0.0

workflow:
  _type: tool_calling_agent
  llm_name: sp_router
  tool_names: [calculator, doc_search, crm_lookup]
  max_iterations: 4
  verbose: true
