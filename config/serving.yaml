# Serving Plane — startup configuration.
# INFRASTRUCTURE SWITCHES ONLY. Everything switchable here; no code changes to
# change modes. Budgets/sensitivity/residency live in policy.yaml; scoring,
# thresholds, the pool and escalation live in routing.yaml. Do not restate their
# values here — the startup config lint (see CLAUDE.md §Config lint) fails the boot
# if the same concern is owned by two files.

# On-prem models are onboarded at runtime (see docs/onboarding-models.md);
# routeForge deploys nothing. There is no `inference_backend` axis any more —
# every provider (onprem/azure/bedrock alike) egresses through the single
# LiteLLM SDK path, and on-prem endpoints come from the ModelRegistry (onboarded
# rows), not a static base_url here. The cloud path (managed_cloud) is not
# selected here either — its availability is providers.azure.enabled /
# providers.bedrock.enabled below.

# Step 5 — Conditional Context Optimization (Headroom). Infra switches only;
# bypass thresholds that depend on policy classification read the canonical
# sensitivity/risk enums owned by policy.yaml.
context_optimization:
  enabled: false                 # default OFF: demo shows before/after
  mode: library                  # library | proxy (sidecar)
  proxy_url: http://headroom:8787
  min_tokens: 2000               # below this, bypass — overhead exceeds gain
  bypass_on:
    high_risk: true              # risk_class == high (see policy.yaml)
    restricted_sensitivity: true # sensitivity == restricted (see policy.yaml enum)
    user_prompt: true            # compress tool outputs/history, not the live question
  ccr:
    enabled: true
    residency: local_only        # NEVER external object store — see hard rule 6
    ttl_hours: 24                # enforced; unbounded cache = retention liability
    export_to_telemetry: false   # must stay false
  cache_alignment: true          # CacheAligner: stabilize prefixes for KV cache hits

# Feature 5 (Task 1) — Persistent memory (mem0-style, step-5 extension).
# CCR-class residency posture (rule 6): local-only, TTL-bounded,
# tenant-partitioned, sanitized-only, NEVER exported. Substrate only here —
# default OFF, no pipeline wiring yet (Task 2 wires read/write in). See
# docs/architecture/persistent-memory-residency-spec.md. Env override: SP_MEMORY.
memory:
  enabled: false                 # default OFF — substrate exists, nothing constructs a store yet
  residency: local_only          # NEVER external store — see hard rule 6
  ttl_hours: 24                  # enforced; ttl_hours <= 0 is a boot-fail
  export_to_telemetry: false     # must stay false — only a counts-only MemoryRecord reaches a trace
  max_recall: 3                  # most-recent-first cap per tenant partition
  min_tokens: 0                  # small-request bypass knob (like compression's min_tokens)
  bypass_on:
    high_risk: true
    restricted_sensitivity: true
    user_prompt: false           # N/A for recall (no live prompt to protect); shape parity with compression
# Feature #6 — semantic cache (design-gate substrate, Task 1). CCR-class: local,
# TTL-enforced, never exported, tenant+residency-partitioned so an onprem_only
# request can never be served a cloud-produced cached response (see
# docs/architecture/semantic-cache-residency-spec.md). Default OFF: with
# enabled: false nothing in the pipeline constructs or touches a cache instance
# at all — Task 2 wires the check/store calls into the pipeline behind this flag.
# Env override: SP_SEMANTIC_CACHE (see loader), mirrors SP_CONTEXT_OPT above.
semantic_cache:
  enabled: false                 # default OFF: no pipeline wiring exists yet (Task 1)
  residency: local_only          # NEVER external — see hard rule 6; lint-enforced
  ttl_hours: 24                  # enforced; unbounded cache = retention liability
  export_to_telemetry: false     # must stay false; only a counts-only CacheRecord traces
  max_entries: 0                 # 0 = unbounded beyond TTL
  bypass_on:
    high_risk: true              # risk_class == high (see policy.yaml)
    restricted_sensitivity: true # sensitivity == restricted (see policy.yaml enum)
    user_prompt: true            # ignored by the cache (whole-request decision); kept for shape parity
  embedding: "off"                # deferred seam (C8) — no embedder wired, no embedding lib imported

policy:
  pii_detection: presidio        # presidio | regex | off
  fail_closed: true              # never relax this
  allow_app_pii_downgrade: true  # false = locked-down deployment: no app may weaken PII detection
  # sensitivity enum, default_sensitivity, budgets and residency: see policy.yaml

observability:
  langfuse:
    enabled: true
    host: ${LANGFUSE_HOST:-http://langfuse:3000}
    redact_on_export: true       # mandatory; see nemo-agent-toolkit skill
    project_id: ${LANGFUSE_PROJECT_ID:-demo-project}  # for UI trace deep-links
    # Eval-capture of request/response I/O on the serving.request trace.
    #   off      — capture nothing (demo default; Input column blank, rule 2 intact)
    #   redacted — attach prompt/completion with entity VALUES masked to <TYPE>
    #              (eval-usable structure, no raw PII); still re-redacted on egress
    #   full     — attach RAW prompt/completion for eval; the config lint REJECTS
    #              this whenever any tenant is onprem_only (residency beats eval —
    #              rule 6), and it must target a residency-local Langfuse only.
    # Env override: SP_CAPTURE_IO (see loader). See docs/eval-logging-backlog.md.
    # Quoted: bare `off` is a YAML boolean, but this is a string enum.
    capture_io: "off"   # off | redacted | full

# Provider *availability* (infra on/off) only. Tier membership is defined by the
# pool in routing.yaml — the single source of truth for which model is which tier.
providers:
  onprem:  {enabled: true,  litellm_prefix: openai,  api_key_env: SP_ONPREM_API_KEY}
  azure:   {enabled: false, litellm_prefix: azure,   api_base_env: AZURE_API_BASE, api_key_env: AZURE_API_KEY, api_version_env: AZURE_API_VERSION}
  bedrock: {enabled: false, litellm_prefix: bedrock}

agent:
  runtime: nat                   # NeMo Agent Toolkit
  # step/spend caps: see policy.yaml agent_budgets

server:
  host: 0.0.0.0
  port: 8080
  stream_decisions: true         # WebSocket/SSE for the UI (tenant-scoped + auth
                                 # outside demo mode — see greenlake-deploy skill)
  reject_stream_requests: true   # reject inbound `stream: true` in the demo (see
                                 # output-controls skill); decision streaming above
                                 # is a separate channel
