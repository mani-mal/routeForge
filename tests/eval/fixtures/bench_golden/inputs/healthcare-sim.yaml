# Simulated endpoints reproducing the §14 table of the Priorities 1-3 LLM
# handoff (RouteForge-Priorities-1-3-LLM-Handoff.md, not tracked in the repo;
# four illustrative healthcare endpoints), for use with
# eval/suites/starter.jsonl. See
# docs/research/feasible-route-bench.md.
#
# §14 table (illustrative):
#   Local Llama    quality 92   $0.08/req   900 ms   raw patient data OK
#   Azure US model quality 89   $0.03/req   600 ms   needs redaction, no retention
#   European model quality 94   $0.02/req   500 ms   ineligible for US-only workloads
#   General US     quality 91   $0.025/req  550 ms   retains prompts
#
# Price conversion: `price_call` (app/routing/pricing.py) bills
# (prompt_tokens*input + completion_tokens*output)/1e6 -- there is no flat
# per-call rate in the real pricing model. Each endpoint's price is
# calibrated to reproduce roughly the table's flat $/request figure at the
# starter suite's claim_summary cases (~1,000 combined prompt+completion
# tokens for a short claim-summary exchange, including the pipeline's system
# prompt). At 1,000 tokens: price(USD/1M) = target_$/req * 1_000_000 / 1_000
# = target_$/req * 1000. input == output rate throughout (the table gives one
# number, not two):
#   local-llama: 0.08 * 1000 = $80/1M    azure-us:   0.03 * 1000 = $30/1M
#   european:    0.02 * 1000 = $20/1M    general-us: 0.025 * 1000 = $25/1M
#
# local-llama and azure-us are deliberately BOTH tier "cheap" and both
# eligible for the claim_summary workload (raw on-prem vs. redacted-after-
# gate cloud), with different price/quality, so cheapest /
# best_published_quality / router can disagree on which to pick. european
# (region eu) is excluded by an app's allowed_regions: [us]; general-us
# (prompt_retention retained) is excluded by require_no_retention -- neither
# is ever swept for a claim case, only rejected with a reason.
#
# NOTE local-llama's non-zero price here is intentional and specific to
# THIS illustrative profile (reproducing §14's $0.08/request), not a claim
# about real on-prem economics -- contrast eval/endpoints/spark-live.example.yaml,
# where a freshly onboarded real on-prem endpoint prices at $0/1M, matching
# docs/guides/onboarding-models.md's own onboarding example.
endpoints:
  - slug: local-llama
    provider: onprem
    tier: cheap
    price: {input: 80, output: 80}
    quality: 0.92
    region: us
    prompt_retention: none
    accepts_raw_sensitive: true
    simulated:
      quality: {claim_summary: 0.92, faq: 0.95, default: 0.90}
      latency_ms: {mean: 900, jitter: 100}

  - slug: azure-us
    provider: azure
    tier: cheap
    price: {input: 30, output: 30}
    quality: 0.89
    region: us
    prompt_retention: none
    accepts_raw_sensitive: false
    simulated:
      quality: {claim_summary: 0.89, faq: 0.93, default: 0.88}
      latency_ms: {mean: 600, jitter: 60}

  - slug: european
    provider: azure
    tier: mid
    price: {input: 20, output: 20}
    quality: 0.94
    region: eu
    prompt_retention: none
    accepts_raw_sensitive: false
    simulated:
      quality: {claim_summary: 0.94, faq: 0.96, default: 0.93}
      latency_ms: {mean: 500, jitter: 50}

  - slug: general-us
    provider: azure
    tier: mid
    price: {input: 25, output: 25}
    quality: 0.91
    region: us
    prompt_retention: "30d"
    accepts_raw_sensitive: false
    simulated:
      quality: {claim_summary: 0.91, faq: 0.94, default: 0.90}
      latency_ms: {mean: 550, jitter: 55}
