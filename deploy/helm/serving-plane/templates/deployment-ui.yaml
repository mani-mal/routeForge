apiVersion: apps/v1
kind: Deployment
metadata:
  name: {{ include "serving-plane.componentFullname" (dict "root" . "component" "ui") }}
  labels:
    {{- include "serving-plane.componentLabels" (dict "root" . "component" "ui") | nindent 4 }}
spec:
  replicas: {{ .Values.replicaCount.ui }}
  selector:
    matchLabels:
      {{- include "serving-plane.componentSelectorLabels" (dict "root" . "component" "ui") | nindent 6 }}
  template:
    metadata:
      labels:
        {{- include "serving-plane.componentSelectorLabels" (dict "root" . "component" "ui") | nindent 8 }}
    spec:
      {{- with .Values.imagePullSecrets }}
      imagePullSecrets:
        {{- toYaml . | nindent 8 }}
      {{- end }}
      securityContext:
        {{- toYaml .Values.podSecurityContext | nindent 8 }}
      containers:
        - name: ui
          image: {{ include "serving-plane.uiImage" . }}
          imagePullPolicy: {{ .Values.image.ui.pullPolicy }}
          securityContext:
            {{- toYaml .Values.securityContext.ui | nindent 12 }}
          ports:
            - name: http
              containerPort: 80
              protocol: TCP
          livenessProbe:
            httpGet:
              path: /
              port: http
            initialDelaySeconds: 5
            periodSeconds: 15
            timeoutSeconds: 3
            failureThreshold: 5
          readinessProbe:
            httpGet:
              path: /
              port: http
            initialDelaySeconds: 3
            periodSeconds: 10
            timeoutSeconds: 3
            failureThreshold: 3
          resources:
            {{- toYaml .Values.resources.ui | nindent 12 }}
      {{- with .Values.nodeSelector }}
      nodeSelector:
        {{- toYaml . | nindent 8 }}
      {{- end }}
      {{- with .Values.affinity }}
      affinity:
        {{- toYaml . | nindent 8 }}
      {{- end }}
      {{- with .Values.tolerations }}
      tolerations:
        {{- toYaml . | nindent 8 }}
      {{- end }}
