apiVersion: apps/v1
kind: Deployment
metadata:
  name: {{ include "serving-plane.componentFullname" (dict "root" . "component" "ui") }}
  labels:
    {{- include "serving-plane.componentLabels" (dict "root" . "component" "ui") | nindent 4 }}
spec:
  replicas: {{ .Values.replicaCount.ui }}
  selector:
    matchLabels:
      {{- include "serving-plane.componentSelectorLabels" (dict "root" . "component" "ui") | nindent 6 }}
  template:
    metadata:
      labels:
        {{- include "serving-plane.componentSelectorLabels" (dict "root" . "component" "ui") | nindent 8 }}
      annotations:
        # Roll the Pod when the nginx conf (upstream api Service) changes.
        checksum/nginx-config: {{ include (print $.Template.BasePath "/ui-nginx-config.yaml") . | sha256sum }}
    spec:
      {{- with .Values.imagePullSecrets }}
      imagePullSecrets:
        {{- toYaml . | nindent 8 }}
      {{- end }}
      securityContext:
        {{- toYaml .Values.podSecurityContext | nindent 8 }}
      containers:
        - name: ui
          image: {{ include "serving-plane.uiImage" . }}
          imagePullPolicy: {{ .Values.image.ui.pullPolicy }}
          securityContext:
            {{- toYaml .Values.securityContext.ui | nindent 12 }}
          ports:
            - name: http
              containerPort: 80
              protocol: TCP
          volumeMounts:
            # Replaces the image's Compose-specific conf (resolver 127.0.0.11,
            # upstream `api`) with one that targets this chart's api Service.
            - name: nginx-conf
              mountPath: /etc/nginx/conf.d/serving-plane.conf
              subPath: serving-plane.conf
              readOnly: true
          livenessProbe:
            httpGet:
              path: /
              port: http
            initialDelaySeconds: 5
            periodSeconds: 15
            timeoutSeconds: 3
            failureThreshold: 5
          readinessProbe:
            httpGet:
              path: /
              port: http
            initialDelaySeconds: 3
            periodSeconds: 10
            timeoutSeconds: 3
            failureThreshold: 3
          resources:
            {{- toYaml .Values.resources.ui | nindent 12 }}
      volumes:
        - name: nginx-conf
          configMap:
            name: {{ include "serving-plane.fullname" . }}-ui-nginx
      {{- with .Values.nodeSelector }}
      nodeSelector:
        {{- toYaml . | nindent 8 }}
      {{- end }}
      {{- with .Values.affinity }}
      affinity:
        {{- toYaml . | nindent 8 }}
      {{- end }}
      {{- with .Values.tolerations }}
      tolerations:
        {{- toYaml . | nindent 8 }}
      {{- end }}
