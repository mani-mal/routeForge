{{/*
Admin console login for the api (ADMIN_EMAIL / ADMIN_PASSWORD). The api seeds
this admin on first boot and would otherwise fall back to admin@routeforge.local
/ changeme, which on a chart that enables ingress by default is a public login.

- admin.password == "changeme"  -> refuse to render.
- admin.password empty          -> generate a random one on first install and
  REUSE the value already in this Secret on every upgrade (lookup), so an
  `helm upgrade` never rotates the login. (`helm template` has no cluster, so
  lookup returns empty there and a fresh value is generated -- that is fine.)
- admin.password set            -> used as given.
*/}}
{{- $password := .Values.admin.password | default "" | toString -}}
{{- if eq $password "changeme" -}}
{{- fail "admin.password must not be 'changeme'. Set a real password with --set admin.password=..., or leave it empty and the chart will generate one (see NOTES.txt for how to read it)." -}}
{{- end -}}
{{- if not $password -}}
{{- $existing := lookup "v1" "Secret" .Release.Namespace (include "serving-plane.adminSecretName" .) -}}
{{- if and $existing $existing.data (index $existing.data "ADMIN_PASSWORD") -}}
{{- $password = index $existing.data "ADMIN_PASSWORD" | b64dec -}}
{{- else -}}
{{- $password = randAlphaNum 24 -}}
{{- end -}}
{{- end -}}
apiVersion: v1
kind: Secret
metadata:
  name: {{ include "serving-plane.adminSecretName" . }}
  labels:
    {{- include "serving-plane.labels" . | nindent 4 }}
type: Opaque
stringData:
  ADMIN_EMAIL: {{ .Values.admin.email | quote }}
  ADMIN_PASSWORD: {{ $password | quote }}
