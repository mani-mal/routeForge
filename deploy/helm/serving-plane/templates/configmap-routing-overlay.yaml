{{- /*
Opt-in routing.yaml overlay (B107). Rendered only when
servingPlane.switchyard.mode is not "off". The api merges it over the image's
config/routing.yaml via SP_CONFIG_OVERLAY_DIR (app/config/loader.py), so the
cross-file lint still runs on the merged result. Only shadow is offered here.
The code supports a deployment `enforce` ceiling since B108, but the chart
keeps refusing it: enforce for real deployments waits for Switchyard 0.4.0
final (owner decision; docs/reference/switchyard-integration.md).
*/ -}}
{{- $mode := .Values.servingPlane.switchyard.mode | default "off" }}
{{- if ne $mode "off" }}
{{- if ne $mode "shadow" }}{{ fail "servingPlane.switchyard.mode must be off or shadow (enforce waits for Switchyard 0.4.0 final)" }}{{ end }}
apiVersion: v1
kind: ConfigMap
metadata:
  name: {{ include "serving-plane.fullname" . }}-routing-overlay
  labels:
    {{- include "serving-plane.labels" . | nindent 4 }}
data:
  routing.yaml: |
    switchyard:
      mode: {{ $mode | quote }}
{{- end }}
