apiVersion: v1
kind: Service
metadata:
  name: {{ include "serving-plane.componentFullname" (dict "root" . "component" "api") }}
  labels:
    {{- include "serving-plane.componentLabels" (dict "root" . "component" "api") | nindent 4 }}
spec:
  type: {{ .Values.service.api.type }}
  ports:
    - port: {{ .Values.service.api.port }}
      targetPort: http
      protocol: TCP
      name: http
  selector:
    {{- include "serving-plane.componentSelectorLabels" (dict "root" . "component" "api") | nindent 4 }}
