{{/*
DEV/DEMO ONLY. Prefer an existing Secret managed by the platform team
(langfuse.existingSecret) — this template only fires when someone has
explicitly opted into chart-managed plaintext keys via
langfuse.createSecret.enabled, and even then only when no existingSecret is
set. See the greenlake-deploy skill: "Secrets via existing K8s Secret
references, never chart values."
*/}}
{{- if and .Values.langfuse.createSecret.enabled (not .Values.langfuse.existingSecret) }}
apiVersion: v1
kind: Secret
metadata:
  name: {{ include "serving-plane.langfuseSecretName" . }}
  labels:
    {{- include "serving-plane.labels" . | nindent 4 }}
  annotations:
    routeforge.io/warning: "dev-only secret created from chart values; use langfuse.existingSecret in any shared/production deployment"
type: Opaque
stringData:
  langfuse-public-key: {{ .Values.langfuse.createSecret.publicKey | quote }}
  langfuse-secret-key: {{ .Values.langfuse.createSecret.secretKey | quote }}
{{- end }}
