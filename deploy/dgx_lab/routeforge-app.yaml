##
## routeForge API + UI for the DGX lab.
##
## Pure router: no model server is deployed here. The on-prem pool boots empty;
## onboard endpoints at runtime (console Infrastructure -> Onboard, or
## POST /admin/infra/models — docs/guides/onboarding-models.md). Config is the
## image's own config/*.yaml; the only deployment-specific value, the Langfuse
## host, comes from LANGFUSE_HOST. Langfuse + its Postgres (also RouteForge's
## application/token/usage DB) come from the sibling langfuse.yaml.
##
## Images live in ghcr.io/mani-mal (private) — the ghcr-pull secret must exist:
##   kubectl create secret docker-registry ghcr-pull -n runai-routeforge \
##     --docker-server=ghcr.io --docker-username=mani-mal --docker-password=<TOKEN>
##
## Deploy:
##   kubectl apply -f deploy/dgx_lab/routeforge-app.yaml -n runai-routeforge
##
## UI:  http://10.89.195.201:30800
## API: http://10.89.195.201:30808   (/health, /v1/chat/completions, /api/*)
##
apiVersion: v1
kind: List
items:

# --- API ---------------------------------------------------------------------
- apiVersion: apps/v1
  kind: Deployment
  metadata:
    name: routeforge-api
    labels: {app: routeforge-api}
  spec:
    replicas: 1
    selector:
      matchLabels: {app: routeforge-api}
    template:
      metadata:
        labels: {app: routeforge-api, runai/node-pool: default}
      spec:
        # runai/node-pool: default (pod label above) is required too: this
        # project's defaultNodePools is [h200s], and Run:ai otherwise injects a
        # gpu.product=NVIDIA-H200 affinity that contradicts the one below.
        # CPU-only: land on the control-plane nodes, never the GPU node (110-pod
        # kubelet cap there). See the deploy-to-dgx skill.
        tolerations:
        - {key: node-role.kubernetes.io/control-plane, operator: Exists, effect: NoSchedule}
        affinity:
          nodeAffinity:
            requiredDuringSchedulingIgnoredDuringExecution:
              nodeSelectorTerms:
              - matchExpressions:
                - {key: nvidia.com/gpu.present, operator: DoesNotExist}
        imagePullSecrets:
        - name: ghcr-pull
        containers:
        - name: api
          image: ghcr.io/mani-mal/serving-plane-api:0.31.0
          ports: [{name: http, containerPort: 8080}]
          env:
          - {name: SP_SERVER_PORT, value: "8080"}
          # SP_PII_DETECTION is read by the loader with env precedence OVER the
          # mounted serving.yaml, so it MUST be set here or the ConfigMap's
          # policy.pii_detection is silently ignored.
          # (The inference_backend axis is gone as of the pure-router pivot —
          # on-prem models are onboarded at runtime via /admin/infra/models with a
          # per-model endpoint, not selected by an SP_INFERENCE_BACKEND env.)
          - {name: SP_PII_DETECTION, value: "presidio"}
          # Attach request/response I/O to the serving.request Langfuse trace so
          # traces are usable as an eval dataset. `redacted` runs the egress
          # redactor (entity values -> <TYPE>, no raw PII). NOT `full`: full is a
          # boot failure here because the `hospital` tenant is onprem_only (the
          # capture_io residency lint). Default (serving.yaml) is off => blank Input.
          - {name: SP_CAPTURE_IO, value: "redacted"}
          # The image's config/serving.yaml reads ${LANGFUSE_HOST}. Setting it alone
          # does NOT turn on per-app project provisioning (that also needs the
          # LANGFUSE_ORG_* pair below).
          - {name: LANGFUSE_HOST, value: "http://langfuse-web:3000"}
          # Langfuse export credentials (demo keys seeded by langfuse.yaml).
          - name: LANGFUSE_PUBLIC_KEY
            valueFrom: {secretKeyRef: {name: langfuse-demo-creds, key: LANGFUSE_PUBLIC_KEY}}
          - name: LANGFUSE_SECRET_KEY
            valueFrom: {secretKeyRef: {name: langfuse-demo-creds, key: LANGFUSE_SECRET_KEY}}
          # Browser-reachable Langfuse URL for the UI's "Langfuse trace" deep-link.
          # host (serving.yaml) is the in-cluster OTLP name; this is the NodePort a
          # laptop browser actually hits. Must match langfuse.yaml's NEXTAUTH_URL.
          - {name: LANGFUSE_PUBLIC_URL, value: "http://10.89.195.201:30300"}
          # Multi-tenant application/token/usage store (spec 2026-07-25): reuse
          # the in-cluster Langfuse Postgres. routeForge's tables (applications,
          # app_tokens, app_policies, usage_records, admin_users) coexist with
          # Langfuse's under distinct names. Needs the image's `postgres` extra
          # (asyncpg) — build with EXTRAS including `postgres`.
          - {name: DATABASE_URL, value: "postgresql+asyncpg://postgres:postgres@langfuse-postgres:5432/postgres"}
          # Admin console login, from a Secret created out of band (never in git):
          #   kubectl -n runai-routeforge create secret generic routeforge-admin \
          #     --from-literal=ADMIN_EMAIL=admin@routeforge.local \
          #     --from-literal=ADMIN_PASSWORD="$(openssl rand -base64 18)"
          - name: ADMIN_EMAIL
            valueFrom: {secretKeyRef: {name: routeforge-admin, key: ADMIN_EMAIL}}
          - name: ADMIN_PASSWORD
            valueFrom: {secretKeyRef: {name: routeforge-admin, key: ADMIN_PASSWORD}}
          # Bearer key for the onboarded `qwen3-coder-next` vLLM endpoint
          # (http://qwen-coder.runai-glm-coding:8000/v1). The onboarding form's
          # "api key env" field takes this variable's NAME, never the key itself.
          # Secret created out of band (never in git):
          #   kubectl -n runai-routeforge create secret generic qwen-coder-key \
          #     --from-literal=SP_QWEN_CODER_API_KEY=<the vLLM --api-key>
          # `optional: true` so the API still boots on a cluster without that model.
          - name: SP_QWEN_CODER_API_KEY
            valueFrom: {secretKeyRef: {name: qwen-coder-key, key: SP_QWEN_CODER_API_KEY, optional: true}}
          # Same pattern for GLM 5.3 Flash (secret `glm-flash-key`, created out of band).
          - name: GLM_FLASH_API_KEY
            valueFrom: {secretKeyRef: {name: glm-flash-key, key: GLM_FLASH_API_KEY, optional: true}}
          # Cloud path for the paper's placement experiments: OpenRouter free
          # models (secret `openrouter-key`, created out of band; synthetic
          # prompts only). The provider, its two pool entries and their prices
          # come from the `routeforge-config-overlay` ConfigMap below (kept in
          # step with deploy/dgx_lab/config-overlay/). Set
          # SP_PROVIDER_OPENROUTER_ENABLED to "false" to turn the cloud path off.
          - {name: SP_CONFIG_OVERLAY_DIR, value: /etc/routeforge/config-overlay}
          - name: OPENROUTER_API_KEY
            valueFrom: {secretKeyRef: {name: openrouter-key, key: OPENROUTER_API_KEY, optional: true}}
          - name: SP_PROVIDER_OPENROUTER_ENABLED
            value: "true"
          # Optional: to auto-provision a Langfuse PROJECT per application on
          # onboard (POST /admin/applications), set the in-cluster Langfuse host
          # plus an organization-scoped API key pair (Langfuse org settings ->
          # API keys). All three are required together; absent -> apps share the
          # default project (still works). See docs/guides/langfuse-per-app-projects.md.
          # - {name: LANGFUSE_HOST, value: "http://langfuse-web:3000"}
          # - name: LANGFUSE_ORG_PUBLIC_KEY
          #   valueFrom: {secretKeyRef: {name: langfuse-demo-creds, key: LANGFUSE_ORG_PUBLIC_KEY}}
          # - name: LANGFUSE_ORG_SECRET_KEY
          #   valueFrom: {secretKeyRef: {name: langfuse-demo-creds, key: LANGFUSE_ORG_SECRET_KEY}}
          # ENCRYPTION_KEY (reused from the langfuse secret) encrypts stored
          # per-app project secrets at rest.
          - name: ENCRYPTION_KEY
            valueFrom: {secretKeyRef: {name: langfuse-demo-creds, key: ENCRYPTION_KEY}}
          resources:
            requests: {cpu: "500m", memory: 2Gi}
            # Presidio (spaCy en_core_web_lg) + the NAT/LangChain stack are
            # memory-heavy; 2Gi was too tight once real traffic + the vLLM
            # httpx client are live.
            limits: {cpu: "2", memory: 6Gi}
          startupProbe:
            httpGet: {path: /health, port: 8080}
            periodSeconds: 5
            failureThreshold: 60
          readinessProbe:
            httpGet: {path: /health, port: 8080}
            periodSeconds: 10
          livenessProbe:
            httpGet: {path: /health, port: 8080}
            periodSeconds: 30
          volumeMounts:
            - {name: config-overlay, mountPath: /etc/routeforge/config-overlay, readOnly: true}
        volumes:
          - name: config-overlay
            configMap: {name: routeforge-config-overlay}

# Deployment-specific config, merged over the image's config/*.yaml by the
# loader (SP_CONFIG_OVERLAY_DIR). Same content as deploy/dgx_lab/config-overlay/.
- apiVersion: v1
  kind: ConfigMap
  metadata:
    name: routeforge-config-overlay
    namespace: runai-routeforge
  data:
    serving.yaml: |
      # DGX lab overlay (SP_CONFIG_OVERLAY_DIR): merged over the shipped config/serving.yaml.
      # OpenRouter is a public model aggregator, used here as the cloud path for the paper's
      # placement experiments, with synthetic prompts only. The declarations are the cautious
      # ones: RouteForge cannot verify what an upstream provider keeps.
      providers:
        openrouter: {enabled: false, litellm_prefix: openrouter, api_key_env: OPENROUTER_API_KEY,
                     prompt_retention: retained, accepts_raw_sensitive: "false"}
    routing.yaml: |
      # DGX lab overlay: appended to the shipped model_pool by name.
      # Free variants are rate-limited and are withdrawn without notice; these two answered
      # 3 of 3 probe calls from the lab on 2026-10-09.
      model_pool:
        - {name: openrouter-mid,      provider: openrouter, tier: mid,      display_name: "Nemotron 3 Super 120B (OpenRouter, free)", litellm_model: "openrouter/nvidia/nemotron-3-super-120b-a12b:free"}
        - {name: openrouter-frontier, provider: openrouter, tier: frontier, display_name: "Nemotron 3 Ultra 550B (OpenRouter, free)", litellm_model: "openrouter/nvidia/nemotron-3-ultra-550b-a55b:free"}
    pricing.yaml: |
      # DGX lab overlay. The pooled ids are FREE variants (billed $0). These are the same
      # models' paid list prices on OpenRouter, USD per 1M tokens, read 2026-10-09, so a $0
      # endpoint does not distort cost scoring or the savings figures. Stated prices, not
      # what a free call costs.
      models:
        openrouter-mid:      {input: 0.08, output: 0.45, tier: mid,      provider: openrouter}
        openrouter-frontier: {input: 0.50, output: 2.20, tier: frontier, provider: openrouter}

# Service named `api` so the UI's nginx.conf (proxy_pass http://api:8080)
# resolves it unmodified.
- apiVersion: v1
  kind: Service
  metadata: {name: api}
  spec:
    selector: {app: routeforge-api}
    ports: [{name: http, port: 8080, targetPort: 8080}]

- apiVersion: v1
  kind: Service
  metadata: {name: routeforge-api-nodeport}
  spec:
    type: NodePort
    selector: {app: routeforge-api}
    ports: [{name: http, port: 8080, targetPort: 8080, nodePort: 30808}]

# --- UI nginx config (Kubernetes variant) ------------------------------------
# ui/nginx.conf hardcodes `resolver 127.0.0.11` (Docker Compose's embedded DNS)
# and the short upstream name `api` — neither works in Kubernetes: the cluster
# DNS is different, and nginx's resolver does NOT apply /etc/resolv.conf search
# domains, so the service must be addressed by FQDN. This ConfigMap overrides
# the baked config with a K8s-correct one. (The Helm chart's UI needs the same
# treatment for GreenLake — the image's nginx.conf is Compose-specific.)
- apiVersion: v1
  kind: ConfigMap
  metadata:
    name: routeforge-ui-nginx
  data:
    serving-plane.conf: |
      resolver 10.150.0.10 valid=10s ipv6=off;
      server {
          listen 80;
          server_name _;
          root /usr/share/nginx/html;
          index index.html;
          location / { try_files $uri $uri/ /index.html; }
          location /api/stream {
              set $up http://api.runai-routeforge.svc.cluster.local:8080;
              proxy_pass $up$request_uri;
              proxy_http_version 1.1;
              proxy_set_header Connection "";
              proxy_buffering off;
              proxy_cache off;
              proxy_read_timeout 3600s;
          }
          location /api/ {
              set $up http://api.runai-routeforge.svc.cluster.local:8080;
              proxy_pass $up$request_uri;
          }
          location /v1/ {
              set $up http://api.runai-routeforge.svc.cluster.local:8080;
              proxy_pass $up$request_uri;
          }
          location /admin/ {
              set $up http://api.runai-routeforge.svc.cluster.local:8080;
              proxy_pass $up$request_uri;
          }
      }

# --- UI ----------------------------------------------------------------------
- apiVersion: apps/v1
  kind: Deployment
  metadata:
    name: routeforge-ui
    labels: {app: routeforge-ui}
  spec:
    replicas: 1
    selector:
      matchLabels: {app: routeforge-ui}
    template:
      metadata:
        labels: {app: routeforge-ui, runai/node-pool: default}
      spec:
        # runai/node-pool: default (pod label above) is required too: this
        # project's defaultNodePools is [h200s], and Run:ai otherwise injects a
        # gpu.product=NVIDIA-H200 affinity that contradicts the one below.
        # CPU-only: land on the control-plane nodes, never the GPU node (110-pod
        # kubelet cap there). See the deploy-to-dgx skill.
        tolerations:
        - {key: node-role.kubernetes.io/control-plane, operator: Exists, effect: NoSchedule}
        affinity:
          nodeAffinity:
            requiredDuringSchedulingIgnoredDuringExecution:
              nodeSelectorTerms:
              - matchExpressions:
                - {key: nvidia.com/gpu.present, operator: DoesNotExist}
        imagePullSecrets:
        - name: ghcr-pull
        containers:
        - name: ui
          image: ghcr.io/mani-mal/serving-plane-ui:0.31.0
          ports: [{name: http, containerPort: 80}]
          resources:
            requests: {cpu: "50m", memory: 64Mi}
            limits: {cpu: "500m", memory: 256Mi}
          volumeMounts:
          - name: nginx-conf
            mountPath: /etc/nginx/conf.d/serving-plane.conf
            subPath: serving-plane.conf
          readinessProbe:
            httpGet: {path: /, port: 80}
            periodSeconds: 10
        # nginx:alpine binds :80 as root; no securityContext hardening here to
        # match the chart's documented ui exception.
        volumes:
        - name: nginx-conf
          configMap:
            name: routeforge-ui-nginx

- apiVersion: v1
  kind: Service
  metadata: {name: routeforge-ui}
  spec:
    selector: {app: routeforge-ui}
    ports: [{name: http, port: 80, targetPort: 80}]

- apiVersion: v1
  kind: Service
  metadata: {name: routeforge-ui-nodeport}
  spec:
    type: NodePort
    selector: {app: routeforge-ui}
    ports: [{name: http, port: 80, targetPort: 80, nodePort: 30800}]
