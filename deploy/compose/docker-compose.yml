# Serving Plane — full local demo stack (greenlake-deploy skill, Phase 8).
#
#   docker compose -f deploy/compose/docker-compose.yml up --build
#
# Brings up: api (FastAPI + NAT + Headroom), ui (nginx-served React), and the
# self-hosted Langfuse stack (web/worker + postgres/clickhouse/redis/minio).
# routeForge is a pure router — it runs no inference backend; on-prem models are
# onboarded at runtime (see docs/onboarding-models.md). Regex PII detection → no
# GPU, no API keys needed for a local bring-up.
#
# Open http://localhost:3001 for the UI, http://localhost:3000 for Langfuse
# (login demo@example.com / demodemo).
name: serving-plane

# The Langfuse stack (postgres/clickhouse/redis/minio/web/worker) with its four
# boot fixes already applied — reused verbatim so there's one source of truth.
include:
  - langfuse.yml

services:
  api:
    build:
      context: ../..
      dockerfile: Dockerfile
      args:
        EXTRAS: "agent,observability"   # NAT multi-step + Langfuse export
    ports: ["8080:8080"]
    environment:
      SP_PII_DETECTION: regex           # offline-safe; presidio needs a model download
      SP_SERVER_PORT: "8080"
      # Point NAT/OTel export at the in-stack Langfuse. Export is best-effort
      # (the API never blocks on it), so the API can start before Langfuse has
      # finished migrating — traces simply begin flowing once it's up.
      LANGFUSE_HOST: http://langfuse-web:3000
      # Browser-reachable Langfuse URL for the UI's "Langfuse trace" deep-link
      # (LANGFUSE_HOST above is the in-container OTLP name; the browser hits this).
      LANGFUSE_PUBLIC_URL: http://localhost:3000
      # Demo-only, non-sensitive: throwaway keys for the ephemeral localhost
      # Langfuse in this stack — they grant access to nothing external. Rotate
      # via .env for anything but a local demo. (Prod Helm uses K8s Secrets.)
      LANGFUSE_PUBLIC_KEY: pk-lf-local
      LANGFUSE_SECRET_KEY: sk-lf-local
      # Multi-tenant store: defaults to an in-container SQLite file (offline,
      # no extra service). To reuse this stack's Postgres instead, set:
      #   DATABASE_URL: postgresql+asyncpg://postgres:postgres@postgres:5432/postgres
      # Admin dashboard login (demo defaults — change for anything real).
      ADMIN_EMAIL: admin@routeforge.local
      ADMIN_PASSWORD: changeme
    depends_on:
      langfuse-web: {condition: service_started}
    healthcheck:
      test: ["CMD", "curl", "-fsS", "http://127.0.0.1:8080/health"]
      interval: 15s
      timeout: 3s
      retries: 5
      start_period: 20s

  ui:
    build:
      context: ../../ui
      dockerfile: Dockerfile
    ports: ["3001:80"]
    depends_on:
      api: {condition: service_healthy}   # nginx proxies /api,/v1 → api
