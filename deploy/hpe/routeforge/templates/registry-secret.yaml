{{- if .Values.imageCredentials.enabled }}
{{/*
dockerconfigjson pull secret for the routeForge api/ui images. Enable this when
you push serving-plane-api/ui into PCAI's local Harbor registry as a PRIVATE
project. If the Harbor project is public, leave imageCredentials.enabled=false
and no secret is needed.

Credentials still land in a Secret rather than in a plain field, but they do come
from values here — for anything past a demo, prefer imageCredentials.enabled=false
plus imagePullSecrets referencing a platform-managed Secret.
*/}}
apiVersion: v1
kind: Secret
metadata:
  name: routeforge-registry
  labels:
    {{- include "routeforge.labels" . | nindent 4 }}
type: kubernetes.io/dockerconfigjson
data:
  .dockerconfigjson: {{ printf `{"auths":{"%s":{"username":"%s","password":"%s","auth":"%s"}}}` .Values.imageCredentials.registry .Values.imageCredentials.username .Values.imageCredentials.password (printf "%s:%s" .Values.imageCredentials.username .Values.imageCredentials.password | b64enc) | b64enc }}
{{- end }}
