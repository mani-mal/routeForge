{{- if .Values.ezua.authorizationPolicy.enabled }}
{{/*
Puts the routeForge UI endpoint behind PCAI's platform SSO (oauth2-proxy). This
matters beyond convenience: the UI carries the SSE decision stream, whose
DecisionRecords include tenant / entity-type / cost / routing metadata. On a
shared PCAI cluster that stream is a metadata leak if left open (greenlake-deploy
skill; CLAUDE.md observability rules), so gate it at the mesh by default.

Note this only authenticates the viewer at the gateway — it does NOT make the
decision stream per-tenant. Multi-tenant scoping is enforced in the app; keep
demo traffic single-tenant until that is on.
*/}}
apiVersion: security.istio.io/v1beta1
kind: AuthorizationPolicy
metadata:
  name: {{ printf "%s-%s-ui-auth" .Release.Name .Chart.Name | trunc 63 | trimSuffix "-" }}
  namespace: {{ .Values.ezua.authorizationPolicy.namespace }}
  labels:
    {{- include "routeforge.labels" . | nindent 4 }}
spec:
  action: CUSTOM
  provider:
    name: {{ .Values.ezua.authorizationPolicy.providerName | quote }}
  rules:
    - to:
        - operation:
            hosts:
              - {{ .Values.ezua.virtualService.endpoint | required ".Values.ezua.virtualService.endpoint is required" }}
  selector:
    matchLabels:
      {{- toYaml .Values.ezua.authorizationPolicy.matchLabels | nindent 6 }}
{{- end }}
