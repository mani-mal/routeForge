      storage: {{ .Values.langfuse.clickhouse.size }}
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: langfuse-clickhouse
  labels:
    {{- include "routeforge.labels" . | nindent 4 }}
    app.kubernetes.io/component: langfuse-clickhouse
spec:
  replicas: 1
  selector:
    matchLabels:
      app.kubernetes.io/instance: {{ .Release.Name }}
      app.kubernetes.io/component: langfuse-clickhouse
  template:
    metadata:
      labels:
        {{- include "routeforge.labels" . | nindent 8 }}
