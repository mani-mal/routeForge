{{- if .Values.langfuse.enabled }}
{{- $secret := include "routeforge.secretName" . }}
{{- $sc := .Values.langfuse.storageClassName | default .Values.global.storageClassName }}
{{/*
Langfuse v3 backing stores — Postgres, ClickHouse, Redis, MinIO — plus the
one-shot Job that creates the MinIO bucket (v3 does not auto-create it). Ported
from deploy/dgx_lab/langfuse.yaml. All CPU-only; none of this touches a GPU.

MinIO here holds Langfuse event uploads ONLY. It must never back the Headroom
CCR cache (CLAUDE.md hard rule 6 — CCR stays on in-cluster block/file storage).
*/}}
# --- Postgres ----------------------------------------------------------------
apiVersion: v1
kind: PersistentVolumeClaim
metadata:
  name: langfuse-postgres
  labels: {{- include "routeforge.labels" . | nindent 4 }}
spec:
  accessModes: ["ReadWriteOnce"]
  {{- with $sc }}
  storageClassName: {{ . | quote }}
  {{- end }}
  resources:
    requests:
      storage: {{ .Values.langfuse.postgres.size }}
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: langfuse-postgres
  labels:
    {{- include "routeforge.labels" . | nindent 4 }}
    app.kubernetes.io/component: langfuse-postgres
spec:
  replicas: 1
  selector:
    matchLabels:
      app.kubernetes.io/instance: {{ .Release.Name }}
      app.kubernetes.io/component: langfuse-postgres
  template:
    metadata:
      labels:
        {{- include "routeforge.labels" . | nindent 8 }}
        app.kubernetes.io/component: langfuse-postgres
    spec:
      containers:
        - name: postgres
          image: {{ include "routeforge.depImage" (dict "root" . "image" .Values.langfuse.images.postgres) }}
          env:
            - name: POSTGRES_PASSWORD
              valueFrom: {secretKeyRef: {name: {{ $secret }}, key: POSTGRES_PASSWORD}}
            - name: PGDATA
              value: /var/lib/postgresql/data/pgdata
          ports: [{containerPort: 5432}]
          volumeMounts:
            - {name: data, mountPath: /var/lib/postgresql/data}
          resources:
            {{- toYaml .Values.langfuse.postgres.resources | nindent 12 }}
      volumes:
        - name: data
          persistentVolumeClaim: {claimName: langfuse-postgres}
---
apiVersion: v1
kind: Service
metadata:
  name: langfuse-postgres
  labels: {{- include "routeforge.labels" . | nindent 4 }}
spec:
  selector:
    app.kubernetes.io/instance: {{ .Release.Name }}
    app.kubernetes.io/component: langfuse-postgres
  ports: [{name: pg, port: 5432, targetPort: 5432}]
---
