---
# --- MinIO -------------------------------------------------------------------
apiVersion: v1
kind: PersistentVolumeClaim
metadata:
  name: langfuse-minio
  labels: {{- include "routeforge.labels" . | nindent 4 }}
spec:
  accessModes: ["ReadWriteOnce"]
  {{- with $sc }}
  storageClassName: {{ . | quote }}
  {{- end }}
  resources:
    requests:
      storage: {{ .Values.langfuse.minio.size }}
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: langfuse-minio
  labels:
    {{- include "routeforge.labels" . | nindent 4 }}
    app.kubernetes.io/component: langfuse-minio
spec:
  replicas: 1
  selector:
    matchLabels:
      app.kubernetes.io/instance: {{ .Release.Name }}
      app.kubernetes.io/component: langfuse-minio
  template:
    metadata:
      labels:
        {{- include "routeforge.labels" . | nindent 8 }}
        app.kubernetes.io/component: langfuse-minio
    spec:
      containers:
        - name: minio
          image: {{ include "routeforge.depImage" (dict "root" . "image" .Values.langfuse.images.minio) }}
          args: ["server", "/data", "--console-address", ":9001"]
          env:
            - name: MINIO_ROOT_USER
              valueFrom: {secretKeyRef: {name: {{ $secret }}, key: MINIO_ROOT_USER}}
            - name: MINIO_ROOT_PASSWORD
              valueFrom: {secretKeyRef: {name: {{ $secret }}, key: MINIO_ROOT_PASSWORD}}
          ports:
            - {name: api, containerPort: 9000}
            - {name: console, containerPort: 9001}
          volumeMounts:
            - {name: data, mountPath: /data}
          resources:
            {{- toYaml .Values.langfuse.minio.resources | nindent 12 }}
      volumes:
        - name: data
          persistentVolumeClaim: {claimName: langfuse-minio}
---
apiVersion: v1
kind: Service
metadata:
  name: langfuse-minio
  labels: {{- include "routeforge.labels" . | nindent 4 }}
spec:
  selector:
    app.kubernetes.io/instance: {{ .Release.Name }}
    app.kubernetes.io/component: langfuse-minio
  ports:
    - {name: api, port: 9000, targetPort: 9000}
    - {name: console, port: 9001, targetPort: 9001}
---
# Create the langfuse bucket once MinIO is up (v3 does not create it itself).
apiVersion: batch/v1
kind: Job
metadata:
  name: langfuse-minio-init
  labels: {{- include "routeforge.labels" . | nindent 4 }}
spec:
  backoffLimit: 10
  template:
    metadata:
      labels:
        {{- include "routeforge.labels" . | nindent 8 }}
        app.kubernetes.io/component: langfuse-minio-init
    spec:
      restartPolicy: OnFailure
      containers:
        - name: mc
          image: {{ include "routeforge.depImage" (dict "root" . "image" .Values.langfuse.images.mc) }}
          command: ["/bin/sh", "-c"]
          args:
            - |
              until mc alias set local http://langfuse-minio:9000 "$MINIO_ROOT_USER" "$MINIO_ROOT_PASSWORD"; do
                echo 'waiting for minio'; sleep 3;
              done
              mc mb --ignore-existing local/langfuse
              echo 'bucket ready'
          env:
            - name: MINIO_ROOT_USER
              valueFrom: {secretKeyRef: {name: {{ $secret }}, key: MINIO_ROOT_USER}}
            - name: MINIO_ROOT_PASSWORD
              valueFrom: {secretKeyRef: {name: {{ $secret }}, key: MINIO_ROOT_PASSWORD}}
{{- end }}
