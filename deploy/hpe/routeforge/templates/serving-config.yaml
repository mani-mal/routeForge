{{/*
Overlays the image's baked /app/config/serving.yaml (infra switches only —
policy/routing/pricing stay baked in, matching CLAUDE.md's config-ownership
split). Mounted via subPath on the api Pod. Field names must match
app/config/loader.py's raw dict access. Env vars on the api container still win
over these for the keys the loader reads from env (SP_PII_DETECTION,
LANGFUSE_HOST) — see api.yaml. Each provider block carries litellm_prefix (the
boot lint's PROVIDER_NO_LITELLM_MAP fails without it) and the *_env NAMES of the
variables holding its endpoint/key, never the values.
*/}}
apiVersion: v1
kind: ConfigMap
metadata:
  name: routeforge-serving-config
  labels:
    {{- include "routeforge.labels" . | nindent 4 }}
data:
  serving.yaml: |
    context_optimization:
      enabled: {{ .Values.servingPlane.contextOptimization.enabled }}
      mode: {{ .Values.servingPlane.contextOptimization.mode | quote }}
      proxy_url: {{ .Values.servingPlane.contextOptimization.proxyUrl | quote }}
      min_tokens: {{ .Values.servingPlane.contextOptimization.minTokens }}
      bypass_on:
        high_risk: {{ .Values.servingPlane.contextOptimization.bypassOn.highRisk }}
        restricted_sensitivity: {{ .Values.servingPlane.contextOptimization.bypassOn.restrictedSensitivity }}
        user_prompt: {{ .Values.servingPlane.contextOptimization.bypassOn.userPrompt }}
      ccr:
        enabled: {{ .Values.servingPlane.contextOptimization.ccr.enabled }}
        residency: {{ .Values.servingPlane.contextOptimization.ccr.residency | quote }}
        ttl_hours: {{ .Values.servingPlane.contextOptimization.ccr.ttlHours }}
        export_to_telemetry: {{ .Values.servingPlane.contextOptimization.ccr.exportToTelemetry }}
      cache_alignment: {{ .Values.servingPlane.contextOptimization.cacheAlignment }}

    policy:
      pii_detection: {{ .Values.servingPlane.policy.piiDetection | quote }}

    observability:
      langfuse:
        enabled: {{ .Values.langfuse.enabled }}
        host: {{ printf "${LANGFUSE_HOST:-%s}" .Values.langfuse.inClusterHost | quote }}
        redact_on_export: true   # mandatory — never make this settable

    providers:
{{- /* litellmPrefix defaults per known provider so a --reuse-values upgrade from an
       older release (whose stored values lack it) still renders; unknown names must set it. */ -}}
{{- $prefixDefaults := dict "onprem" "openai" "azure" "azure" "bedrock" "bedrock" }}
{{- range $name, $p := .Values.servingPlane.providers }}
      {{ $name }}:
        enabled: {{ $p.enabled }}
        litellm_prefix: {{ required (printf "servingPlane.providers.%s.litellmPrefix is required" $name) ($p.litellmPrefix | default (get $prefixDefaults $name)) | quote }}
        {{- with $p.apiBaseEnv }}
        api_base_env: {{ . | quote }}
        {{- end }}
        {{- with $p.apiKeyEnv }}
        api_key_env: {{ . | quote }}
        {{- end }}
        {{- with $p.apiVersionEnv }}
        api_version_env: {{ . | quote }}
        {{- end }}
{{- end }}

    server:
      host: {{ .Values.servingPlane.server.host | quote }}
      port: {{ .Values.servingPlane.server.port }}
      stream_decisions: {{ .Values.servingPlane.server.streamDecisions }}
      reject_stream_requests: {{ .Values.servingPlane.server.rejectStreamRequests }}
