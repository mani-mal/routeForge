{{- if not .Values.credentials.existingSecret }}
{{- /* Admin password: refuse `changeme`; if empty, generate once and reuse the
       value already in this Secret on upgrade (lookup) so it never rotates.
       `helm template` has no cluster, so lookup is empty there: it generates. */ -}}
{{- $adminPassword := dig "credentials" "adminPassword" "" .Values.AsMap | toString -}}
{{- if eq $adminPassword "changeme" -}}
{{- fail "credentials.adminPassword must not be 'changeme'. Set a real password, or leave it empty and the chart will generate one (see NOTES.txt for how to read it)." -}}
{{- end -}}
{{- if not $adminPassword -}}
{{- $existing := lookup "v1" "Secret" .Release.Namespace "routeforge-creds" -}}
{{- if and $existing $existing.data (index $existing.data "ADMIN_PASSWORD") -}}
{{- $adminPassword = index $existing.data "ADMIN_PASSWORD" | b64dec -}}
{{- /* A reused value is held to the same rule: an install seeded with
       `changeme` must not keep it across upgrades. Not exercisable by
       `helm template` (lookup is empty there); verified by inspection. */ -}}
{{- if eq $adminPassword "changeme" -}}
{{- fail "The existing routeforge-creds Secret still holds the admin password 'changeme' from an earlier install. Set a new one with --set credentials.adminPassword=<new> (the chart will not silently regenerate it). NOTE: the api only seeds the admin when none exists with that email (app/apps/admin_auth.py seed_admin), so changing the value does NOT change the stored login: also change the admin password in the console, or delete the admin row so it is re-seeded on next boot. The same value seeds the Langfuse login only on Langfuse's first init." -}}
{{- end -}}
{{- else -}}
{{- $adminPassword = randAlphaNum 24 -}}
{{- end -}}
{{- end -}}
{{/*
All shared credentials for the bundle, in ONE Secret so the Langfuse stack and
the routeForge API agree on them:
  - Postgres / ClickHouse / MinIO passwords (Langfuse backing stores)
  - NEXTAUTH_SECRET / SALT / ENCRYPTION_KEY (Langfuse; ENCRYPTION_KEY is reused
    by the API to encrypt per-application project secrets at rest)
  - LANGFUSE_PUBLIC_KEY / LANGFUSE_SECRET_KEY (what the API authenticates to
    Langfuse with; seeded into Langfuse via LANGFUSE_INIT_*)
  - ADMIN_EMAIL / ADMIN_PASSWORD (routeForge admin console login; also seeds
    the Langfuse login -- see langfuse-app.yaml)

The defaults below are DEMO values (they match deploy/compose/.env.example and
the DGX lab). For anything past a demo, create your own Secret with these keys
and set credentials.existingSecret to its name — then this template is skipped.
*/}}
apiVersion: v1
kind: Secret
metadata:
  name: routeforge-creds
  labels:
    {{- include "routeforge.labels" . | nindent 4 }}
  annotations:
    # Keep the Secret across upgrades so seeded Langfuse keys / encryption key
    # don't rotate out from under existing data.
    "helm.sh/resource-policy": keep
type: Opaque
stringData:
  POSTGRES_PASSWORD: {{ .Values.credentials.postgresPassword | quote }}
  CLICKHOUSE_PASSWORD: {{ .Values.credentials.clickhousePassword | quote }}
  MINIO_ROOT_USER: {{ .Values.credentials.minioRootUser | quote }}
  MINIO_ROOT_PASSWORD: {{ .Values.credentials.minioRootPassword | quote }}
  NEXTAUTH_SECRET: {{ .Values.credentials.nextauthSecret | quote }}
  SALT: {{ .Values.credentials.salt | quote }}
  ENCRYPTION_KEY: {{ .Values.credentials.encryptionKey | quote }}
  LANGFUSE_PUBLIC_KEY: {{ .Values.credentials.langfusePublicKey | quote }}
  LANGFUSE_SECRET_KEY: {{ .Values.credentials.langfuseSecretKey | quote }}
  ADMIN_EMAIL: {{ dig "credentials" "adminEmail" "admin@routeforge.local" .Values.AsMap | quote }}
  ADMIN_PASSWORD: {{ $adminPassword | quote }}
{{- end }}
